<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CipherLoom Vault</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">🔐 <strong>CipherLoom</strong><span class="muted">· encrypted knowledge vault</span></div>
      <div class="actions">
        <button id="btn-relock" class="ghost" hidden>Lock vault</button>
        <button id="btn-add" class="primary">+ Encrypt file</button>
        <input id="file-input" type="file" hidden multiple />
      </div>
    </header>

    <section class="askbar">
      <input id="ask-input" placeholder="Ask your vault… e.g. What are the termination clauses in this NDA?" />
      <button id="ask-btn" class="primary">Ask</button>
    </section>

    <main class="layout">
      <section class="vault">
        <div class="row-head">
          <input id="search" placeholder="Search files / tags…" />
          <span id="stat" class="muted"></span>
        </div>
        <div id="grid" class="grid"></div>
        <div id="empty" class="empty" hidden>
          <p>Your vault is empty.</p>
          <p class="muted">Encrypt a file to get started — ciphertext-only at rest (AES-256-GCM).</p>
        </div>
      </section>

      <aside class="panel" id="detail" hidden>
        <h3 id="d-title">Detail</h3>
        <pre id="d-body" class="code"></pre>
        <div id="d-meta" class="muted"></div>
      </aside>

      <aside class="panel" id="answer" hidden>
        <h3>Answer</h3>
        <div id="a-body"></div>
        <div id="a-cites" class="muted"></div>
        <div id="a-run" class="muted"></div>
      </aside>
    </main>

    <footer class="status" id="status">Connecting…</footer>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
